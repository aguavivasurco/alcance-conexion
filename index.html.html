<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#d90000;--black:#111;--gray:#6e6e6e;--lgray:#e4e4e4;--white:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--black);font-family:Montserrat,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:14px 20px;border-bottom:3px solid var(--red)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:46px;height:46px;border-radius:12px;flex:none}
h1{margin:0;font-size:20px;font-weight:700;line-height:1.1}
.sub{margin:3px 0 0;font-size:13px;font-weight:500;color:var(--gray)}
nav{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{font-family:inherit;background:var(--white);color:var(--black);border:1px solid var(--gray);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}
nav button.on{background:var(--red);border-color:var(--red);color:var(--white)}
main{padding:20px;max-width:1100px;margin:0 auto}
.view{display:none}.view.on{display:block}
h2{font-size:16px;margin:0 0 14px;border-left:4px solid var(--red);padding-left:10px;font-weight:700}
.filters{margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.fr{display:grid;gap:10px;grid-template-columns:repeat(var(--n),minmax(0,1fr));max-width:calc(var(--n)*210px)}
.ms{position:relative;min-width:0}
.ms .lb{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:4px}
.trig{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--gray);border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer;background:var(--white);min-height:38px}
.trig input,.trig .tv{border:0;outline:0;width:100%;min-width:0;font:inherit;background:transparent;color:var(--black);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trig input::placeholder{color:var(--black);opacity:1}
.ms.open .trig{border-color:var(--red);box-shadow:0 0 0 2px rgba(217,0,0,.15)}
.panel{display:none;position:absolute;z-index:20;top:100%;left:0;min-width:max(100%,180px);margin-top:4px;background:var(--white);border:1px solid var(--gray);border-radius:10px;max-height:230px;overflow-y:auto;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.ms.open .panel{display:block}
.op{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:6px;font-size:13px;cursor:pointer}
.op:hover{background:#f3f3f3}.op input{accent-color:var(--red)}
.clr{font-family:inherit;width:100%;text-align:left;background:none;border:0;color:var(--red);font-size:12px;font-weight:600;padding:6px 8px;cursor:pointer}
.res{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
.stack{display:flex;flex-direction:column;gap:12px}
.ct{font-size:12px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.card{border:1px solid var(--lgray);border-bottom:3px solid var(--red);border-radius:12px;padding:12px 16px}
.card b{display:block;font-size:28px;font-weight:700}
.dn{display:flex;flex-direction:column}.dn .card{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
.donut{position:relative;width:100%;max-width:230px}
.donut svg{display:block;width:100%;height:auto}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:clamp(18px,5vw,30px)}
.dc small{font-size:11px;font-weight:600;color:var(--gray)}
.tw{overflow-x:auto;border:1px solid var(--gray);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
#rank{min-width:560px}
th{background:var(--red);color:var(--white);text-align:left;padding:11px 10px;white-space:nowrap;font-weight:600}
td{padding:9px 10px;border-bottom:1px solid var(--lgray)}tr:last-child td{border-bottom:0}tr:hover td{background:#f7f7f7}
td.n,th.n{text-align:right}
.ar{font-weight:700;white-space:nowrap}
.cnt{margin:0 0 10px;font-size:12px;color:var(--gray)}
.st{display:inline-block;padding:2px 10px;border:1px solid var(--gray);border-radius:20px;font-size:12px;white-space:nowrap}.st.c{background:var(--red);border-color:var(--red);color:var(--white)}
.legend{margin-top:14px;font-size:12px;color:var(--gray);display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.plot{display:flex;margin:34px 0 52px}
.ax{position:relative;height:300px;width:44px;flex:none;font-size:11px;color:var(--gray)}
.ax span{position:absolute;transform:translateY(50%);right:6px}.ax.r span{left:6px;right:auto}
.area{position:relative;flex:1;min-width:0;height:300px;display:flex;border-left:1px solid var(--gray);border-right:1px solid var(--gray);border-bottom:1px solid var(--gray)}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--lgray)}
.grp{flex:1;min-width:0;display:flex;justify-content:center;align-items:flex-end;gap:4px;height:100%;position:relative;z-index:1}
.tn{position:absolute;top:100%;margin-top:10px;width:100%;text-align:center;font-size:12px;font-weight:600;line-height:1.25}
.b{position:relative;width:min(48px,42%);display:flex;align-items:center;justify-content:center;border-radius:6px 6px 0 0}
.b.g{background:var(--black)}.b.e{background:var(--red)}
.up{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);text-align:center;font-size:13px;font-weight:700;padding-bottom:4px;white-space:nowrap}
.up.r{color:var(--red)}
.in{color:var(--white);font-size:12px;font-weight:700;white-space:nowrap}
@media(max-width:600px){
 header{padding:12px 14px}main{padding:14px}
 h1{font-size:18px}.sub{font-size:12px}.brand img{width:40px;height:40px}
 nav{width:100%}
 .fr{max-width:none;gap:8px}
 .fr.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .trig{padding:8px 9px;font-size:12px}.ms .lb{font-size:11px}
 .ms:nth-child(even) .panel,.ms:last-child .panel{left:auto;right:0}
 .res{gap:10px}.card{padding:10px 12px}.card b{font-size:24px}.ct{font-size:11px}
 th,td{padding:8px 7px}table{font-size:12px}
 .ax{width:30px;font-size:10px}.ax span{right:4px}.ax.r span{left:4px}
 .plot{margin:30px 0 56px}
 .tn{font-size:10px}.up{font-size:11px}.in{font-size:9.5px;letter-spacing:-.2px}
 .b{width:46%}.grp{gap:3px}

const efHTML=p=>{const[a,c]=ar(p);return `<span class="ar" style="color:${c}">${a} ${fmt(p)}</span>`};

function MS(host,label,opts,cb,search){
 const st=new Set();let q='';
 host.className='ms';
 host.innerHTML=`<span class="lb">${label}</span><div class="trig">${search?'<input autocomplete="off">':'<span class="tv"></span>'}<span>▾</span></div><div class="panel"></div>`;
 const trig=host.querySelector('.trig'),panel=host.querySelector('.panel'),inp=host.querySelector('input'),tv=host.querySelector('.tv');
 const sum=()=>{const s=st.size==0?'Todos':st.size==1?[...st][0]:st.size+' seleccionados';if(inp)inp.placeholder=s;else tv.textContent=s};
 function paint(){const l=opts.filter(o=>!q||o.toLowerCase().startsWith(q.toLowerCase()));

 panel.addEventListener('change',e=>{const v=e.target.dataset.v;e.target.checked?st.add(v):st.delete(v);sum();cb()});
 panel.addEventListener('click',e=>{if(e.target.classList.contains('clr')){st.clear();paint();cb()}});
 trig.addEventListener('click',()=>{document.querySelectorAll('.ms.open').forEach(m=>{if(m!==host)m.classList.remove('open')});host.classList.add('open');if(inp)inp.focus()});
 if(inp)inp.addEventListener('input',()=>{q=inp.value.trim();paint();cb()});
 document.addEventListener('click',e=>{if(!host.contains(e.target))host.classList.remove('open')});
 paint();
 return{ok:v=>(st.size==0||st.has(v))&&(!q||v.toLowerCase().startsWith(q.toLowerCase()))};
}
function filters(id,rows,cb){const el=document.getElementById(id),F={};
 rows.forEach(ks=>{const row=document.createElement('div');row.className='fr n'+ks.length;row.style.setProperty('--n',ks.length);el.appendChild(row);
  ks.forEach(k=>{const h=document.createElement('div');row.appendChild(h);F[k]=MS(h,LB[k],OPT[k],cb,k==='cod')})});
 const ks=Object.keys(F);return r=>ks.every(k=>F[k].ok(r[KEY[k]]))}
