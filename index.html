<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--r:#ed0102;--k:#111;--g:#6e6e6e;--l:#e4e4e4;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--k);font-family:Montserrat,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{position:relative;z-index:30;background:var(--r);color:#fff;padding:12px 18px}
.hr{display:flex;align-items:center;gap:12px}.brand{display:flex;gap:12px;align-items:center;min-width:0;flex:1}.brand img{width:58px;height:58px;border-radius:12px;flex:none}
h1{margin:0;font-size:19px;line-height:1.1;color:#fff}.sub{margin:2px 0 0;font-size:12px;font-weight:500;color:rgba(255,255,255,.88)}
.st{margin:2px 0 0;font-size:9.5px;color:rgba(255,255,255,.75)}.st.bad{color:#fff;font-weight:700;background:rgba(0,0,0,.28);display:inline-block;padding:1px 7px;border-radius:6px}
#tabs{display:flex;gap:6px}.t{font:inherit;font-size:13px;font-weight:600;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.7);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}.t.on{background:#fff;color:var(--r);border-color:#fff}
.ib{display:flex;gap:8px;align-items:center}.ico{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.65);border-radius:10px;color:#fff;cursor:pointer;padding:0}.mob{display:none}
.sw{position:relative}#svp{display:none;position:absolute;right:0;top:100%;margin-top:6px;background:#fff;color:var(--k);border:1px solid var(--g);border-radius:10px;padding:6px;min-width:150px;box-shadow:0 6px 18px rgba(0,0,0,.2)}#svp.open{display:block}
#menu{display:none;flex-direction:column;gap:0;margin-top:6px}#menu button{font:inherit;font-size:11px;font-weight:600;text-align:left;background:none;border:0;color:rgba(255,255,255,.82);padding:7px 8px;border-radius:8px;cursor:pointer}#menu button.on{color:#fff;font-weight:700;background:rgba(255,255,255,.16)}
header.open #menu{display:flex}.m #tabs{display:none}.m .mob{display:flex}
main{padding:16px 18px;max-width:1100px;margin:0 auto}.v{display:none}.v.on{display:block}
main.loading .v{display:none!important}#load{display:none;text-align:center;padding:60px 0;color:var(--g);font-weight:600}main.loading #load{display:block}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.lb{display:block;font-size:11px;font-weight:600;color:var(--g);margin-bottom:4px}
.svb{display:flex;gap:8px}.svb button{font:inherit;font-size:13px;font-weight:600;padding:9px 18px;border-radius:10px;border:1px solid var(--g);background:#fff;cursor:pointer}.svb button.on{background:var(--r);border-color:var(--r);color:#fff}
.slot{min-width:92px}
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.fr{display:grid;gap:8px;grid-template-columns:repeat(var(--n),minmax(0,1fr));max-width:calc(var(--n)*210px)}
.ms{position:relative;min-width:0}
.trig{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--g);border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer;background:#fff;min-height:36px}
.trig input,.tv{border:0;outline:0;width:100%;min-width:0;font:inherit;background:transparent;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trig input::placeholder{color:inherit;opacity:1}
.ms.has .trig{border-color:var(--r);background:#fff1f1;color:var(--r);font-weight:600}
.ms.open .trig{box-shadow:0 0 0 2px rgba(217,0,0,.18)}
.panel{display:none;position:absolute;z-index:20;top:100%;left:0;min-width:max(100%,180px);margin-top:4px;background:#fff;border:1px solid var(--g);border-radius:10px;max-height:230px;overflow-y:auto;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.12)}.ms.open .panel{display:block}
.op{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:6px;font-size:13px;cursor:pointer}.op:hover{background:#f3f3f3}.op input{accent-color:var(--r)}
.clr{font:inherit;width:100%;text-align:left;background:none;border:0;color:var(--r);font-size:12px;font-weight:600;padding:6px 8px;cursor:pointer}
.ct{font-size:10px;font-weight:600;color:var(--g);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.card{border:1px solid var(--l);border-bottom:3px solid var(--r);border-radius:10px;padding:8px 10px}.card b{font-size:22px;display:block;line-height:1.2}
.res{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.sq{display:grid;grid-template-columns:repeat(2,96px);gap:8px}
.dn .card{display:flex;justify-content:center;padding:10px}.donut{position:relative;width:100%;max-width:150px}.donut svg{display:block;width:100%}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:clamp(14px,4.4vw,22px)}.dc small{font-size:10px;font-weight:600;color:var(--g)}
.ai{vertical-align:-1px}.ar{font-weight:700;white-space:nowrap}
.dbx{border:1px solid var(--g);border-radius:12px;overflow:hidden}
.dh,.dr{display:grid;grid-template-columns:92px 1fr 46px;gap:8px;align-items:center;padding:0 10px}
.dh{height:28px;background:#fafafa;border-bottom:1px solid var(--l);font-size:10px;color:var(--g)}.tk{display:flex;justify-content:space-between}.tk i{font-style:normal}
.dsc{max-height:264px;overflow-y:auto}.dr{height:36px;border-bottom:1px solid #f0f0f0}.dr:last-child{border:0}
.dl{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dl small{color:var(--g);font-weight:500;margin-left:4px}
.dt{height:12px;background:#f0f0f0;border-radius:6px;overflow:hidden}.df{height:100%;background:var(--r);border-radius:6px}.dv{font-size:11px;font-weight:700;text-align:right}
.note{font-size:12px;color:var(--g);padding:12px}
.plot{display:flex;margin:36px 0 44px}.ax{position:relative;height:260px;width:34px;flex:none;font-size:10px;color:var(--g)}.ax span{position:absolute;transform:translateY(50%);right:5px}
.area{position:relative;flex:1;min-width:0;height:260px;display:flex;border-left:1px solid var(--g);border-bottom:1px solid var(--g)}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--l)}
.grp{flex:1;min-width:0;display:flex;justify-content:center;align-items:flex-end;height:100%;position:relative;z-index:1;padding:0 8px}
.bar{position:relative;width:min(60px,100%);background:var(--r);border-radius:6px 6px 0 0}
.up{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:13px;font-weight:700;padding-bottom:3px}
.cn{position:absolute;left:0;right:0;bottom:0;background:#8d8d8d;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.pc{position:absolute;left:0;right:0;text-align:center;color:#fff;font-size:11px;font-weight:700;white-space:nowrap}.pc.out{bottom:calc(100% + 20px)!important;color:var(--r)}
.tn{position:absolute;top:100%;margin-top:8px;width:100%;text-align:center;font-size:12px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;font-size:11px;color:var(--g)}.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tb{border:1px solid var(--g);border-radius:12px;overflow:hidden}
.sc{max-height:330px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--r) #eee}.sc::-webkit-scrollbar{width:8px}.sc::-webkit-scrollbar-thumb{background:var(--r);border-radius:4px}.sc::-webkit-scrollbar-track{background:#eee}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{position:sticky;top:0;z-index:2;background:var(--r);color:#fff;text-align:left;padding:10px;white-space:nowrap;font-weight:600}
td{padding:9px 10px;border-bottom:1px solid var(--l)}tfoot td{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--r);border-bottom:0;font-weight:700}
.n{text-align:right}th.n{cursor:pointer}.c{text-align:center}#rank tbody tr{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;padding:8px;font-size:11px;color:var(--g);border-top:1px solid var(--l)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle}.lg .dot{width:10px;height:10px;margin-right:4px}
#tip{position:fixed;display:none;z-index:50;background:var(--k);color:#fff;border-radius:10px;padding:8px 11px;font-size:11px;min-width:150px;pointer-events:none}#tip div{display:flex;justify-content:space-between;gap:14px;margin-top:2px}
html.m body{max-width:430px;margin:0 auto;box-shadow:0 0 0 1px var(--l);min-height:100vh}
